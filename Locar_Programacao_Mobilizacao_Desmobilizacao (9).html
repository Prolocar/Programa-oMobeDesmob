<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Locar | Programação de Mobilização & Desmobilização</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ===== Locar · Programação de Mobilização & Desmobilização — CSS consolidado ===== */
:root{
 --bg:#eef1f5;--card:#fff;--ink:#1b2430;--muted:#5b6879;--line:#d9e0e8;--line2:#e8edf3;
 --dark:#171c24;--yel:#f5bd19;--yel-soft:#fff6d6;--danger:#b3261e;--obs:#3e4c5e;
 --r:8px;color-scheme:light;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.4 "Roboto","Segoe UI",Arial,sans-serif}
button{font:500 13px "Roboto",Arial,sans-serif;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #2563eb;outline-offset:1px}
.hid{display:none!important}

/* ---- Barra de ferramentas ---- */
.tools{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 8px;padding:10px 22px;background:var(--dark);border-bottom:3px solid var(--yel)}
.tools label{display:flex;flex-direction:column;gap:3px;font-size:11px;font-weight:500;color:#c9d1dc}
.tools input{height:34px;padding:0 8px;border:1px solid #39424f;border-radius:6px;background:#fff;color:var(--dark);font:inherit;font-weight:500}
.tools input[type=number]{width:64px}
.tools button{height:34px;padding:0 14px;border-radius:6px;border:1px solid var(--yel);background:var(--yel);color:var(--dark);font-weight:700}
.tools button:hover{filter:brightness(1.07)}
.tools button.alt{background:transparent;color:#eef1f5;border-color:#4a5463;font-weight:500}
.tools button.alt:hover{border-color:var(--yel);color:var(--yel);filter:none}
.tools .grow{flex:1}
.tools .sep{width:1px;height:26px;background:#3a4350;margin:0 6px 4px}

/* ---- Estrutura ---- */
main{max-width:1500px;margin:0 auto;padding:18px 22px 10px}
#cap{background:var(--bg)}

/* ---- Cabeçalho do documento ---- */
.brand{display:flex;flex-wrap:wrap;align-items:center;gap:12px 22px;margin-bottom:12px;padding:14px 22px;background:#fff;border:1px solid var(--line);border-top:5px solid var(--yel);border-radius:10px}
.brand .logo{display:block;width:150px;height:auto;flex:0 0 150px;object-fit:contain}
.vr{width:1px;height:44px;background:var(--line)}
.ttl{flex:1;min-width:220px}
.ttl b{display:block;font:800 clamp(22px,2.3vw,32px)/1.1 "Barlow Condensed","Arial Narrow",Arial,sans-serif;letter-spacing:.01em;color:var(--dark)}
.hd{text-align:right}
.hd b{display:block;font:800 clamp(20px,2vw,28px)/1.1 "Barlow Condensed","Arial Narrow",Arial,sans-serif;color:var(--dark)}
.hd span{display:block;margin-top:2px;font-size:12px;font-weight:500;color:var(--muted)}

/* ---- Legenda ---- */
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-bottom:14px;padding:9px 14px;background:#fff;border:1px solid var(--line);border-radius:var(--r);font-size:12px;font-weight:500;color:var(--obs)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px}

/* ---- Dias ---- */
#days{display:flex;flex-direction:column;gap:20px}
.day{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.dayhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 16px;background:#f6f8fa;border-bottom:1px solid var(--line);border-left:6px solid var(--yel)}
.dayhead .wd{order:-1;font:800 26px/1 "Barlow Condensed","Arial Narrow",Arial,sans-serif;color:var(--dark);min-width:0}
.dayhead input[type=date]{height:32px;min-width:140px;padding:0 8px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--dark);font:500 13px "Roboto",Arial,sans-serif}
.dayhead .sp{flex:1}
.dayhead button{height:30px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--muted)}
.dayhead button:hover{border-color:var(--danger);color:var(--danger)}
.dayhead button.arm{background:var(--danger);color:#fff;border-color:var(--danger)}

/* ---- Quadros ---- */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:stretch;padding:16px}
.sec{min-width:0;height:100%;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ch{margin:0;padding:9px 14px;font:800 19px/1.2 "Barlow Condensed","Arial Narrow",Arial,sans-serif;letter-spacing:.03em;color:#fff;background:#2a3442;border-bottom:3px solid var(--yel)}
.sec.m .ch{background:var(--yel);color:var(--dark);border-bottom-color:var(--dark)}
.sec.over{outline:3px dashed var(--yel);outline-offset:-3px;background:#fffbe8}

/* ---- Tabela ---- */
.row{display:grid;grid-template-columns:18px 104px minmax(120px,1fr) minmax(160px,1.8fr) 28px;align-items:stretch;min-width:0}
.row>*{min-width:0}
.row.h .n,.row.h>div:nth-child(2),.rw>.n{display:none}
.row.h{background:#f1f4f8;border-bottom:1px solid var(--line);color:var(--muted);font:500 12px "Roboto",Arial,sans-serif}
.row.h div{padding:7px 8px;text-align:center}
.row.h div:nth-child(5){text-align:left}
.rw{min-height:42px;background:#fff;border-bottom:1px solid var(--line2)}
.rw:last-of-type{border-bottom:0}
.rw.alt{background:#fafbfd}
.rw:hover{background:var(--yel-soft)}
.rw>div{display:flex;align-items:center;justify-content:center}
.rw>div>*{width:100%}
.rw input,.rw select,.rw textarea{border:0;background:transparent;color:var(--dark);font:inherit}
.rw input{height:34px;padding:0 6px;text-align:center;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.rw .mv{margin:5px 6px 5px 0;border-radius:6px}
.rw select{height:30px;padding:0 6px;text-align:center;text-align-last:center;font-weight:500;font-size:12px;cursor:pointer;color:var(--dark)}
.rw .mv select option{background:#fff;color:var(--dark)}
.rw .co{justify-content:flex-start}
.rw textarea{display:block;min-height:34px;padding:9px 8px;resize:none;overflow:hidden;text-align:left;line-height:1.35;font-weight:400;font-size:13px;color:var(--obs)}
.rw textarea::placeholder{color:#8794a5;opacity:1}
.rw input:focus,.rw select:focus,.rw textarea:focus{outline:2px solid var(--yel);outline-offset:-2px;background:#fffdf2}
.add{display:block;width:100%;height:34px;border:0;border-top:1px dashed var(--line);border-radius:0;background:#fafbfc;color:var(--muted);font-weight:500;font-size:12px}
.add:hover{background:var(--yel-soft);color:var(--dark)}
.note{max-width:1500px;margin:12px auto 0;font-size:12px;color:var(--muted)}

/* ---- Arrastar / mover ---- */
.rw .gr .grip{display:flex;align-items:center;justify-content:center;width:14px;height:22px;border-radius:3px;cursor:grab}
.rw .gr .grip:hover{background:#fff1b8}
.rw .gr .grip i{display:block;width:8px;height:14px;background:radial-gradient(circle,#8794a5 1.3px,transparent 1.6px) 0 0/4px 4.7px}
.rw .mb .mvbtn{width:24px;height:24px;padding:0;border:1px solid var(--line);border-radius:5px;background:#fff;color:#344760;font-size:14px;line-height:1}
.rw .mb .mvbtn:hover{background:var(--yel);border-color:var(--yel);color:var(--dark)}
.rw.emp .grip,.rw.emp .mvbtn{visibility:hidden}
.rw.dragging{opacity:.4}
.rw.dbefore{box-shadow:0 -3px 0 0 var(--yel);position:relative;z-index:2}
.rw.dafter{box-shadow:0 3px 0 0 var(--yel);position:relative;z-index:2}
.mvmenu{position:fixed;z-index:50;min-width:230px;max-height:60vh;overflow:auto;padding:4px 0;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(16,24,40,.22)}
.mvmenu .mt{padding:7px 12px;border-bottom:1px solid var(--line2);font:700 12px "Roboto",Arial,sans-serif;color:var(--muted)}
.mvmenu button{display:block;width:100%;height:auto;padding:8px 12px;border:0;border-radius:0;background:#fff;color:var(--dark);text-align:left;font:500 13px "Roboto",Arial,sans-serif}
.mvmenu button:hover:not(:disabled){background:#fff4c2}
.mvmenu button:disabled{opacity:.35;cursor:default}
.empty{padding:30px;text-align:center;color:var(--muted)}

/* ---- Mensagem de envio ---- */
.msgbox{max-width:1500px;margin:18px auto 0;padding:0 22px}
.msgbox .mc{padding:14px 16px;background:#fff;border:1px solid var(--line);border-left:5px solid var(--yel);border-radius:10px}
.msgbox .mh{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:0 0 10px}
.msgbox .mh b{flex:1;font:700 15px "Roboto",Arial,sans-serif;color:var(--dark)}
.msgbox button{height:34px;padding:0 14px;border-radius:6px;border:1px solid var(--yel);background:var(--yel);color:var(--dark);font-weight:700}
.msgbox button.alt{background:#fff;border-color:var(--line);color:var(--obs);font-weight:500}
.msgbox textarea{display:block;width:100%;min-height:150px;padding:10px;resize:vertical;border:1px solid var(--line);border-radius:7px;background:#fbfcfd;color:var(--dark);font:400 14px/1.5 "Roboto","Segoe UI",Arial,sans-serif}
.msgbox .ok{font-size:12px;font-weight:700;color:#2e7d32;opacity:0;transition:opacity .2s}
.msgbox .ok.on{opacity:1}
.devby{max-width:1456px;margin:14px auto 0;padding:14px 0 26px;border-top:1px solid var(--line);text-align:center;font-size:12px;color:var(--muted)}
.devby b{color:var(--dark)}

/* ---- Versão de texto (exportar JPEG/PDF e imprimir) ---- */
.pv{display:none;padding:7px 8px;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;line-height:1.35;text-align:center}
.pv-f{font-weight:700;font-size:15px;color:var(--dark);white-space:nowrap}
.pv-t{font-weight:500;font-size:12px;color:var(--dark)}
.pv-b{text-align:left;font-size:13px;color:var(--obs)}
body.exporting .row,body.exporting #days .row{grid-template-columns:104px minmax(120px,1fr) minmax(160px,1.8fr)}
body.exporting .gr,body.exporting .mb,body.exporting .add,body.exporting .dayhead button,body.exporting .row.h .gr,body.exporting .row.h .mb{display:none!important}
body.exporting .rw input,body.exporting .rw select,body.exporting .rw textarea{display:none!important}
body.exporting .pv{display:block}
body.exporting .day,body.exporting .sec{overflow:visible}
body.exporting .rw select{appearance:none;-webkit-appearance:none}

/* ---- Responsivo ---- */
@media(max-width:1000px){.cols{grid-template-columns:1fr}}
@media(max-width:850px){
 main{padding:12px}.msgbox{padding:0 12px}.cols{padding:10px;gap:10px}
 .row{grid-template-columns:16px 92px minmax(100px,1fr) minmax(110px,1.5fr) 26px}
 .brand .logo{width:130px;flex-basis:130px}.vr{display:none}.hd{text-align:left}
}

/* ---- Ajuste para caber em 1 página (aplicado por script antes de imprimir) ---- */
body.printfit #cap{width:1100px}
body.printfit .cols{grid-template-columns:1fr 1fr!important;padding:10px;gap:10px}
body.printfit #days{gap:10px}
body.printfit .brand{padding:10px 18px;margin-bottom:8px}
body.printfit .legend{margin-bottom:8px}

/* ---- Impressão ---- */
@media print{
 @page{size:A4 landscape;margin:6mm}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 body{background:#fff}
 main{padding:0}
 .devby{display:none!important}
 html,body{height:auto;overflow:hidden}
 .tools,.msgbox,.add,.dayhead button,.dayhead .sp,.note,.gr,.mb,.mvmenu{display:none!important}
 #days{gap:8px}
 .day{break-inside:avoid;overflow:visible}
 .cols{align-items:start;padding:10px}
 .sec{height:auto;overflow:visible}
 .row,#days .row{grid-template-columns:104px minmax(120px,1fr) minmax(160px,1.8fr)}
 .rw input,.rw select,.rw textarea{display:none!important}
 .rw select{appearance:none;-webkit-appearance:none}
 .pv{display:block}
 .rw{break-inside:avoid;page-break-inside:avoid}
 .rw:hover{background:inherit}
}
</style>
</head>
<body>

 <button class="alt" id="dlpdf">Baixar PDF</button>
 <button class="alt" id="dljpg">Baixar JPEG</button>
 <button class="alt" id="print">Imprimir</button>
 <span class="sep"></span>
 <button class="alt" id="clear">Limpar tudo</button>
</div>

<script>
var TIPOS=[
 ["prep","Preparação MEV","#c5e07a"],["prev","Manutenção preventiva","#5fcf8a"],["lav","Lavagem/Lubrificação","#4dd0e1"],
 ["mob","Mobilização","#8ab4f8"],["desmob","Desmobilização","#b39ddb"],["spot","Atendimento SPOT","#f48fb1"],
 ["volta","Volta em frente a filial","#fff176"],["vist","Vistoria MEV","#ffb74d"],["teste","Teste de carga/cabo","#c9c9c9"],["corr","Manutenção corretiva","#ef6f6c"]];
TIPOS.sort(function(a,b){return a[1].localeCompare(b[1],"pt-BR")});
var KEY="locar_mobdesmob_v1", state={days:[]}, DEFROWS=1, NEUTRO="#aab4c8";
var $=function(id){return document.getElementById(id)};
function load(){try{var s=localStorage.getItem(KEY);if(s){state=JSON.parse(s)}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function mkRows(n){var a=[];for(var i=0;i<n;i++)a.push({f:"",b:"",t:""});return a}
function mkDay(date){return{d:date,des:mkRows(DEFROWS),mob:mkRows(DEFROWS)}}
function iso(dt){var m=("0"+(dt.getMonth()+1)).slice(-2),d=("0"+dt.getDate()).slice(-2);return dt.getFullYear()+"-"+m+"-"+d}
function parse(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function fmt(s){var p=s.split("-");return p[2]+"/"+p[1]+"/"+p[0]}
var WD=["Domingo","Segunda-feira","Terça-feira","Quarta-feira","Quinta-feira","Sexta-feira","Sábado"];
function wd(s){return s?WD[parse(s).getDay()]:""}
function nextDate(){var l=state.days[state.days.length-1];var d=l&&l.d?parse(l.d):new Date();if(l)d.setDate(d.getDate()+1);return iso(d)}
function colorOf(t){var x=TIPOS.filter(function(y){return y[0]===t})[0];return x?x[2]:""}
function legend(){$("legend").innerHTML=TIPOS.map(function(t){return '<span><i style="background:'+t[2]+'"></i>'+t[1]+'</span>'}).join("")}
function hdr(){var ds=state.days.map(function(d){return d.d}).filter(Boolean).sort();
 $("hdate").textContent=ds.length?(ds.length>1?fmt(ds[0])+" a "+fmt(ds[ds.length-1]):fmt(ds[0])):"";
 $("hsub").textContent=state.days.length+(state.days.length===1?" DIA":" DIAS")}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;")}
function grow(t){t.style.height="auto";t.style.height=t.scrollHeight+"px"}
function growAll(){Array.prototype.forEach.call(document.querySelectorAll("textarea"),grow)}
function isEmpty(r){return !((r.f||"").trim()||r.t||(r.b||"").trim())}
function fleetSort(a,b){
 var aa=String(a.f||"").trim(),bb=String(b.f||"").trim();
 if(!aa)return bb?1:0;if(!bb)return -1;
 var na=aa.split("/").map(function(x){return parseInt(x,10)||0}),nb=bb.split("/").map(function(x){return parseInt(x,10)||0});
 for(var i=0;i<Math.max(na.length,nb.length);i++){var diff=(nb[i]||0)-(na[i]||0);if(diff)return diff}
 return bb.localeCompare(aa,"pt-BR",{numeric:true});
}
var SORTN=false;function normalize(){state.days.forEach(function(d){["des","mob"].forEach(function(k){var a=(d[k]||[]).filter(function(r){return !isEmpty(r)});if(SORTN)a.sort(fleetSort);a.push({f:"",b:"",t:""});d[k]=a})})}
function sortSec(d,k){var a=state.days[d][k].filter(function(r){return !isEmpty(r)});a.sort(fleetSort);a.push({f:"",b:"",t:""});state.days[d][k]=a}

function secHTML(di,kind,title,rows){

function render(){
 hdr();
 if(!state.days.length){$("days").innerHTML='<div class="empty">Nenhum dia ainda. Escolha a data inicial e clique em “Gerar dias”.</div>';return}
 $("days").innerHTML=state.days.map(function(d,i){
  return '<section class="day"><div class="dayhead"><input type="date" data-date="'+i+'" value="'+d.d+'" aria-label="Data"><span class="wd">'+wd(d.d)+'</span><span class="sp"></span>'+
  '<button data-del="'+i+'">Excluir dia</button></div><div class="cols">'+secHTML(i,"des","DESMOBILIZAÇÃO",d.des)+secHTML(i,"mob","MOBILIZAÇÃO",d.mob)+'</div></section>'

function addDays(n){
 var s=$("start").value||nextDate(), dt=parse(s);
 for(var i=0;i<n;i++){state.days.push(mkDay(iso(dt)));dt.setDate(dt.getDate()+1)}
 $("start").value="";save();render()
}
$("gen").onclick=function(){var n=Math.max(1,Math.min(15,parseInt($("qty").value,10)||1));addDays(n)};
$("one").onclick=function(){addDays(1)};

$("print").onclick=function(){pOn();setTimeout(function(){window.print();setTimeout(pOff,500)},50)};
var armed=null;
function arm(btn,fn){
 if(armed===btn){armed=null;fn();return}
 armed=btn;var old=btn.textContent;btn.textContent="Confirmar?";btn.classList.add("arm");
 setTimeout(function(){if(armed===btn){armed=null;btn.textContent=old;btn.classList.remove("arm")}},3000)
}
$("clear").onclick=function(e){arm(e.currentTarget,function(){state.days=[];save();render();$("clear").textContent="Limpar tudo";$("clear").classList.remove("arm")})};
var dz=$("days");
dz.addEventListener("input",function(e){
 var el=e.target,f=el.getAttribute("data-f");if(!f)return;
 var rows=state.days[+el.dataset.d][el.dataset.k];rows[+el.dataset.r][f]=el.value;save();
 if(el.tagName==="TEXTAREA")grow(el);
 if(f==="t"){var c=colorOf(el.value);el.parentNode.style.background=c;el.closest(".row").querySelector(".n i").style.background=c||NEUTRO}
 var rowEl=el.closest(".row"),pv=rowEl.querySelector(".pv-"+f);
 if(pv)pv.textContent=(f==="t")?lbl(el.value):el.value;

 var ri=+el.dataset.r;
 if(ri===rows.length-1&&!isEmpty(rows[ri])){rows.push({f:"",b:"",t:""});save();el.closest(".sec").querySelector(".add").insertAdjacentHTML("beforebegin",rowHTML(+el.dataset.d,el.dataset.k,rows.length-1,rows[rows.length-1]))}
});
dz.addEventListener("change",function(e){
 var el=e.target;

  var rs=state.days[+el.dataset.d][el.dataset.k],cur=rs.filter(function(r){return !isEmpty(r)}),srt=cur.slice().sort(fleetSort);

});
dz.addEventListener("click",function(e){
 var b=e.target.closest("button");if(!b)return;
 if(b.hasAttribute("data-mv")){openMenu(b,+b.dataset.d,b.dataset.k,+b.dataset.r);return}
 if(b.hasAttribute("data-add")){state.days[+b.dataset.d][b.dataset.add].push({f:"",b:"",t:""});save();render()}
 else if(b.hasAttribute("data-del")){arm(b,function(){state.days.splice(+b.dataset.del,1);save();render()})}
});
/* Mover frotas entre quadros/dias */
function moveRow(sd,sk,sr,dd,dk,idx){
 var same=(sd===dd&&sk===dk);
 if(same&&idx==null)return;
 var row=state.days[sd][sk].splice(sr,1)[0];
 if(!row||isEmpty(row)){render();return}
 if(!same&&sk!==dk){if(dk==="mob"&&row.t==="desmob")row.t="mob";else if(dk==="des"&&row.t==="mob")row.t="desmob"}
 var dest=state.days[dd][dk];
 if(same&&idx>sr)idx--;
 if(idx==null){dest.push(row);state.days[dd][dk]=dest;normalize();sortSec(dd,dk)}
 else{dest.splice(Math.min(idx,dest.length),0,row);normalize()}
 save();render()
}
var menu=null;
function closeMenu(){if(menu){menu.remove();menu=null}}
function openMenu(btn,sd,sk,sr){
 closeMenu();
 var m=document.createElement("div");m.className="mvmenu";
 var h='<div class="mt">Mover para…</div>';
 state.days.forEach(function(d,i){["des","mob"].forEach(function(k){
  var cur=(i===sd&&k===sk);
  h+='<button'+(cur?' disabled':'')+' data-td="'+i+'" data-tk="'+k+'">'+wd(d.d)+(d.d?" "+fmt(d.d).slice(0,5):"")+' · '+(k==="des"?"Desmobilização":"Mobilização")+(cur?" (atual)":"")+'</button>'})});
 m.innerHTML=h;document.body.appendChild(m);
 var r=btn.getBoundingClientRect(),w=m.offsetWidth,hh=m.offsetHeight;
 var left=Math.max(8,Math.min(window.innerWidth-w-8,r.right-w)),top=r.bottom+4;
 if(top+hh>window.innerHeight-8)top=Math.max(8,r.top-hh-4);
 m.style.left=left+"px";m.style.top=top+"px";
 m.addEventListener("click",function(e){var b=e.target.closest("button[data-td]");if(!b||b.disabled)return;closeMenu();moveRow(sd,sk,sr,+b.dataset.td,b.dataset.tk)});
 menu=m
}
document.addEventListener("mousedown",function(e){if(menu&&!menu.contains(e.target)&&!(e.target.closest&&e.target.closest(".mvbtn")))closeMenu()});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeMenu()});
window.addEventListener("scroll",closeMenu,true);
var drag=null;
function clearDrag(){drag=null;Array.prototype.forEach.call(document.querySelectorAll(".over,.dragging"),function(x){x.classList.remove("over","dragging")})}
dz.addEventListener("dragstart",function(e){
 var g=e.target.closest&&e.target.closest(".grip");if(!g)return;
 drag={d:+g.dataset.d,k:g.dataset.k,r:+g.dataset.r};
 e.dataTransfer.effectAllowed="move";try{e.dataTransfer.setData("text/plain","frota")}catch(x){}
 var row=g.closest(".row");try{e.dataTransfer.setDragImage(row,20,16)}catch(x){}
 row.classList.add("dragging")
});
dz.addEventListener("dragend",clearDrag);
function clearMarks(){Array.prototype.forEach.call(document.querySelectorAll(".dbefore,.dafter"),function(x){x.classList.remove("dbefore","dafter")})}
dz.addEventListener("dragover",function(e){
 if(!drag)return;var sc=e.target.closest(".sec");if(!sc)return;
 e.preventDefault();e.dataTransfer.dropEffect="move";
 Array.prototype.forEach.call(document.querySelectorAll(".sec.over"),function(x){if(x!==sc)x.classList.remove("over")});sc.classList.add("over");
 clearMarks();drag.pos=null;
 var row=e.target.closest(".rw");
 if(row&&sc.contains(row)){
  var inp=row.querySelector("[data-r]"),rc=row.getBoundingClientRect(),before=e.clientY<rc.top+rc.height/2;
  drag.pos=(+inp.dataset.r)+(before?0:1);row.classList.add(before?"dbefore":"dafter")
 }

dz.addEventListener("drop",function(e){

 moveRow(d.d,d.k,d.r,+sc.dataset.d,sc.dataset.k,d.pos==null?undefined:d.pos)

window.addEventListener("resize",growAll);function fitPrint(on){
 var cap=$("cap"),b=document.body;cap.style.zoom="";
 if(!on){b.classList.remove("printfit","exporting");hideEmpty(false);return}
 b.classList.add("exporting","printfit");growAll();hideEmpty(true);
 var s=Math.min(1,1050/cap.offsetWidth,690/cap.offsetHeight);
 cap.style.zoom=s
}
var _pf=false;
function pOn(){if(!_pf){_pf=true;fitPrint(true)}}
function pOff(){if(_pf){_pf=false;fitPrint(false)}}
window.addEventListener("beforeprint",pOn);window.addEventListener("afterprint",pOff);
try{var _mq=window.matchMedia("print");var _ml=function(e){e.matches?pOn():pOff()};_mq.addListener?_mq.addListener(_ml):_mq.addEventListener("change",_ml)}catch(x){}
function localSave(o){return new Promise(function(res){var b=o.data instanceof Blob?o.data:new Blob([o.data]),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=o.filename;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000);res({status:"saved"})})}
function getDl(){return (window.claude&&window.claude.use)?window.claude.use("downloads"):Promise.resolve(null)}
function fname(ext){var d=state.days[0];return "programacao-mob-desmob"+(d&&d.d?"-"+fmt(d.d).replace(/\//g,"-"):"")+"."+ext}
function brDates(on){
 var ins=document.querySelectorAll('input[type=date]');
 for(var i=0;i<ins.length;i++){
  var inp=ins[i];
  if(on){
   var sp=document.createElement("span"),cs=getComputedStyle(inp);
   sp.className="dtbr";sp.textContent=inp.value?fmt(inp.value):"";
   sp.style.cssText="display:inline-flex;align-items:center;box-sizing:border-box;height:"+cs.height+";padding:0 "+cs.paddingLeft+";border:"+cs.border+";border-radius:"+cs.borderRadius+";background:"+cs.backgroundColor+";color:"+cs.color+";font:"+cs.font;
   inp.style.display="none";inp.parentNode.insertBefore(sp,inp)
  }else{
   inp.style.display="";var n=inp.previousSibling;if(n&&n.className==="dtbr")n.remove()
  }
 }
}
function shot(el){
 var root=document.documentElement,prev=root.getAttribute("data-theme");
 root.setAttribute("data-theme","light");document.body.classList.add("exporting");growAll();hideEmpty(true);brDates(true);
 return html2canvas(el,{scale:2,backgroundColor:"#eef1f5"}).finally(function(){brDates(false);document.body.classList.remove("exporting");hideEmpty(false);if(prev===null)root.removeAttribute("data-theme");else root.setAttribute("data-theme",prev)})
}
function toBlob(c,type,q){return new Promise(function(res){c.toBlob(res,type,q)})}
async function doExport(kind,btn){
 if(!state.days.length)return;
 var old=btn.textContent;btn.disabled=true;btn.textContent="Gerando…";
 try{
  var dl=await getDl();
  if(!dl)dl={save:localSave};
  if(kind==="jpg"){
   var c=await shot($("cap"));
   await dl.save({filename:fname("jpg"),data:await toBlob(c,"image/jpeg",0.92)});
  }else{
   var secs=document.querySelectorAll(".day"),pdf=new window.jspdf.jsPDF({orientation:"landscape",unit:"mm",format:"a4"}),W=297,H=210,M=6;
   for(var i=0;i<secs.length;i++){
    var cv=await shot(secs[i]),w=W-2*M,h=w*cv.height/cv.width;
    if(h>H-2*M){h=H-2*M;w=h*cv.width/cv.height}
    if(i)pdf.addPage();
    pdf.addImage(cv.toDataURL("image/jpeg",0.92),"JPEG",M,M,w,h)
   }
   await dl.save({filename:fname("pdf"),data:pdf.output("blob")});
  }
 }catch(e){if(!e||e.code!=="declined")alert("Não foi possível gerar o arquivo.")}
 finally{btn.disabled=false;btn.textContent=old}
}
$("dlpdf").onclick=function(e){doExport("pdf",e.currentTarget)};
$("dljpg").onclick=function(e){doExport("jpg",e.currentTarget)};
